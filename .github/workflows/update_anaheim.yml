name: Anaheim Public Utilities Rate Sync

on:
  schedule:
    # Runs at 8:00 AM UTC on July 1st and January 1st (Municipal Fiscal Year Cadence)
    - cron: '0 8 1 1,7 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run mode'
        required: true
        type: boolean
        default: false

jobs:
  scrape-and-sync-anaheim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf pdfplumber

      - name: Run Anaheim Scraper
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Executing in DRY RUN mode..."
            python scrapers/update_anaheim_rates.py --verbose --dry-run
          else
            python scrapers/update_anaheim_rates.py --verbose
          fi

      - name: Commit and Push Updated Rates
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Anaheim Rate Sync [skip ci]"
          file_pattern: "rates/anaheim_rates.json"
